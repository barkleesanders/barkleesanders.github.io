name: Review Dependabot metadata

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this privileged job.
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3 (Node 24)
        with:
          github-token: ${{ github.token }}

      # A master merge publishes this site through GitHub Pages. Dependency
      # metadata and build checks cannot authorize a production release.
      - name: Record metadata for release review
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          test -n "$DEPENDENCIES"
          printf 'Dependencies: %s; update type: %s\n' "$DEPENDENCIES" "${UPDATE_TYPE:-unknown}"
          echo 'Manual release review is required before merging to the Pages source branch.'
