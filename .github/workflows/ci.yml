name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ruby:
    name: Ruby (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    env:
      BUNDLE_FROZEN: 'true'
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: bundle install
      - run: bundle exec ruby scripts/test-check-site.rb
      - run: bundle exec bundler-audit check --update
      - run: bundle exec rake -T
      - run: gem build minimal-mistakes-jekyll.gemspec --output /tmp/theme.gem
      - run: bundle exec jekyll build --source test --destination /tmp/theme-site --trace
      - run: bundle exec ruby scripts/check-site.rb /tmp/theme-site
      - run: bundle exec jekyll build --destination /tmp/personal-site --trace
      - run: bundle exec ruby scripts/check-site.rb /tmp/personal-site --release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.ruby == '4.0'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
        if: matrix.ruby == '4.0'
      - run: npm run lint
        if: matrix.ruby == '4.0'
      - run: npx --no-install playwright install --with-deps chromium
        if: matrix.ruby == '4.0'
      - run: node scripts/check-readability.mjs /tmp/personal-site /tmp/readability
        if: matrix.ruby == '4.0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.ruby == '4.0'
        with:
          name: rendered-readability
          path: /tmp/readability
          if-no-files-found: error
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run build:js
      - run: node --check assets/js/main.min.js
      - run: node scripts/test-watch-js.mjs
      - run: git diff --exit-code -- assets/js/main.min.js
