name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '4.0'
      - run: bundle install
      - run: bundle exec bundler-audit check --update
      - run: bundle exec jekyll build --destination /tmp/site --trace
      - run: bundle exec ruby scripts/check-site.rb /tmp/site
      - run: gem build minimal-mistakes-jekyll.gemspec --output /tmp/minimal-mistakes-jekyll.gem
      - name: Publish packaged theme
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" /tmp/minimal-mistakes-jekyll.gem --generate-notes
